name: Emirates Application Monitor

on:
  schedule:
    # Pokreće se svaka 2 sata između 09:00 i 17:00 po vremenu u Dubaiju (05:00 do 13:00 UTC)
    - cron: '0 5-13/2 * * *'
  workflow_dispatch: # Omogućava i ručno pokretanje po potrebi

jobs:
  check-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run status checker
        env:
          EMIRATES_EMAIL: ${{ secrets.EMIRATES_EMAIL }}
          EMIRATES_PASSWORD: ${{ secrets.EMIRATES_PASSWORD }}
        run: |
          python checker.py

      - name: Upload HTML debug artifact on failure/change
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-files
          path: "*.html"
          retention-days: 7
